<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="朝のニュースを読んだAIの戦略選択と、仮想500万円の売買結果を記録する日誌。">
  <title>日本株AI 朝の戦略日誌</title>
  <style>
    :root { color-scheme: light; --paper: #f6f5ee; --ink: #233b36; --rule: #d5dcd0; --muted: #53635c; --white: #fffef9; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.75 system-ui, Meiryo, sans-serif; }
    header, main { max-width: 880px; margin: auto; padding: 0 clamp(16px, 5vw, 42px); }
    header { padding-block: 30px 26px; }
    nav { display: flex; gap: 10px 22px; flex-wrap: wrap; font-size: .9rem; }
    a { color: #2e624d; text-underline-offset: .2em; }
    h1 { font: 700 clamp(30px, 7vw, 52px)/1.2 "Yu Mincho", "Hiragino Mincho ProN", serif; margin: 30px 0 12px; }
    h2, h3, h4 { line-height: 1.4; }
    h2 { margin-top: 30px; font-size: 1.25rem; }
    h3 { margin: 4px 0 12px; }
    h4, article p { margin: 10px 0; }
    section { padding-bottom: 22px; border-top: 1px solid var(--rule); }
    time, .note { color: var(--muted); font-size: .9rem; }
    .table-wrap { overflow-x: auto; }
    table { background: var(--white); width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { border-bottom: 1px solid var(--rule); padding: .5em .75em; white-space: nowrap; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    article { background: var(--white); padding: 18px clamp(15px, 4vw, 27px); margin: 0 0 12px; border: 1px solid var(--rule); }
    article p { overflow-wrap: anywhere; white-space: pre-wrap; }
    details summary { color: var(--muted); cursor: pointer; margin-top: 14px; }
  </style>
</head>
<body>
  <header>
    <nav aria-label="関連ページ">
      <a href="../ai-trader-500/">既存のAI仮想運用</a>
      <a href="https://github.com/seikoubon/seikoubon.github.io/tree/main/morning-strategy-journal">運用ルールと台帳</a>
    </nav>
    <h1>日本株AI 朝の戦略日誌</h1>
    <p>東証の営業日、朝8時30分からニュース・米国市場・日経225先物を確認。AIが仮想500万円の戦略を選び、前営業日の取引結果とともに記録します。</p>
  </header>
  <main>
    <section aria-labelledby="performance">
      <h2 id="performance">500万円からの資産推移</h2>
      <p class="note">比較基準は2026年11月20日引け。既存運用は基準日の評価額を500万円に換算しています。</p>
      <div class="table-wrap">
        <table aria-label="日次の仮想資産評価額">
          <thead><tr><th scope="col">評価日</th><th scope="col">朝の戦略選択</th><th scope="col">既存のAI運用</th></tr></thead>
          <tbody id="equity"></tbody>
        </table>
      </div>
      <p class="note" id="load-status" role="status">台帳を読み込んでいます。</p>
    </section>
    <section aria-labelledby="journal-title">
      <h2 id="journal-title">日誌</h2>
      <div id="journal"></div>
    </section>
  </main>
  <script>
    const money = new Intl.NumberFormat('ja-JP', {
      style: 'currency', currency: 'JPY', maximumFractionDigits: 0
    });
    const status = document.querySelector('#load-status');

    function add(parent, tag, text) {
      const element = document.createElement(tag);
      if (text !== undefined) element.textContent = text;
      parent.append(element);
      return element;
    }

    function renderLedger(ledger) {
      const equity = document.querySelector('#equity');
      const journal = document.querySelector('#journal');
      const rows = ledger.closes
        .filter(row => row.status === 'confirmed_close' && Number.isFinite(row.total_jpy))
        .map(row => [
          row.date,
          money.format(row.total_jpy),
          Number.isFinite(row.existing_total_jpy)
            ? money.format(row.existing_total_jpy / ledger.baseline.existing_portfolio_value_jpy * ledger.initial_capital_jpy)
            : '未確認'
        ]);
      rows.push([ledger.baseline.date + '（基準）', money.format(ledger.initial_capital_jpy), money.format(ledger.initial_capital_jpy)]);
      rows.sort((a, b) => b[0].localeCompare(a[0]));
      for (const cells of rows) {
        const tr = add(equity, 'tr');
        for (const cell of cells) add(tr, 'td', cell);
      }
      status.textContent = ledger.closes.some(row => row.status === 'pending_unverified')
        ? '確認待ちの取引日があります。評価額は確定後に掲載します。'
        : '';

      const entries = [...ledger.journal].sort((a, b) => b.date.localeCompare(a.date));
      if (!entries.length) add(journal, 'p', '初回の営業日から判断と結果を掲載します。');
      for (const entry of entries) {
        const article = add(journal, 'article');
        article.id = 'day-' + entry.date;
        const stamp = entry.decision_at_jst;
        add(article, 'time', stamp ? stamp.slice(0, 16).replace('T', ' ') + ' JST' : entry.date).dateTime = stamp || entry.date;
        add(article, 'h3', [entry.strategy, entry.action].filter(Boolean).join(' ／ '));
        for (const [heading, value] of [
          ['前営業日の結果', entry.review],
          ['寄り前の材料', entry.market],
          ['選んだ理由', entry.reason],
          ['仮想注文', entry.orders_text]
        ]) {
          if (!value) continue;
          add(article, 'h4', heading);
          add(article, 'p', value);
        }
        if (!entry.sources?.length) continue;
        const details = add(article, 'details');
        add(details, 'summary', '出典');
        const list = add(details, 'ul');
        for (const source of entry.sources) {
          let url;
          try { url = new URL(source.url); } catch { continue; }
          if (url.protocol !== 'https:') continue;
          add(add(list, 'li'), 'a', source.label || url.hostname).href = url.href;
        }
      }
    }

    fetch('data/ledger.json', { cache: 'no-cache' })
      .then(response => {
        if (!response.ok) throw new Error('Ledger unavailable');
        return response.json();
      })
      .then(renderLedger)
      .catch(() => { status.textContent = '台帳を読み込めませんでした。'; });
  </script>
</body>
</html>
