<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>四季報 表エクスポート</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; width: 350px; background: #f7f8fb; font: 14px/1.5 system-ui,-apple-system,"Yu Gothic",sans-serif; color: #202b38; }
    h1 { margin: 0 0 5px; font-size: 17px; }
    p { margin: 0 0 14px; font-size: 12px; color: #617084; }
    .actions { display: grid; gap: 9px; }
    button { border: 0; border-radius: 9px; padding: 12px; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #csv { background: #176b44; }
    #copy { background: #2458aa; }
    #status { margin-top: 13px; padding: 9px 10px; background: #fff; border: 1px solid #dae0ea; border-radius: 8px; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    #status.error { border-color: #dd8c8c; color: #9d2f2f; }
    .note { margin-top: 10px; font-size: 11px; color: #68778b; }
  </style>
</head>
<body>
  <h1>四季報 表エクスポート</h1>
  <p>スクリーニング結果のタブを開いて操作してください。</p>
  <div class="actions">
    <button id="csv" type="button">CSVファイルを保存</button>
    <button id="copy" type="button">クリップボードにコピー</button>
  </div>
  <div id="status" role="status" aria-live="polite">準備完了</div>
  <div class="note">CSVはExcel向けUTF-8 BOM付き。コピーはExcel・スプレッドシートに貼り付けやすいタブ区切りです。現在画面の表のみを取得します。</div>
  <script src="popup.js"></script>
</body>
</html>
